spring:
  datasource:
    # H2 file-based DB by default — no install required. Override with DATASOURCE_URL for PostgreSQL.
    url: ${DATASOURCE_URL:jdbc:h2:file:./repolens-dev;AUTO_SERVER=TRUE}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true   # browse at http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: update   # auto-creates tables on first run
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  graphql:
    graphiql:
      enabled: true   # GraphQL playground at http://localhost:8080/graphiql

server:
  port: ${SERVER_PORT:8080}

github:
  token: ${GITHUB_TOKEN:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
